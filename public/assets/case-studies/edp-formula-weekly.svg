      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="1000" height="620" rx="14" fill="url(#bg2)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
