  <text x="124" y="71" fill="#F8FAFC" font-family="'Consolas', monospace" font-size="13" font-weight="600">
    =SUMIFS('DATA MENTAH'!$D:$D, 'DATA MENTAH'!$U:$U, 2026, 'DATA MENTAH'!$W:$W, $A4)
  </text>

