      <text x="660" y="26" fill="#FBBF24" font-family="'Consolas', monospace" font-size="12" font-weight="bold">2.34 pcs</text>
      <text x="780" y="26" fill="#E2E8F0" font-family="'Consolas', monospace" font-size="12">Rp 288,339</text>
    </g>

    <!-- Row 6 (WEEK 38) -->
